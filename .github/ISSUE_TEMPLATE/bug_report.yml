name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a **security vulnerability**, do not file here — see `SECURITY.md`.
        For a **question or usage help**, use Discussions.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally a minimal config/data snippet that triggers the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `pip show challenge-data-checker`, or the commit SHA.
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, RDKit version — whatever is relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
