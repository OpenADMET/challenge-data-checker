name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}  # required for micromamba env activation

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install package
        run: pip install -e ".[parquet,test,remote]"

      - name: Work around broken RDKit stub package
        # RDKit bundles auto-generated .pyi stubs (rdkit-stubs) that
        # periodically contain invalid signatures (e.g. a parameter without
        # a default following one with a default), which makes mypy abort
        # with a syntax error before it can check anything. This is a
        # long-standing, unresolved upstream issue that recurs in different
        # files across releases (see rdkit/rdkit#8339, #7554, #8673, #7378).
        # Since rdkit is otherwise untyped for mypy (ignore_missing_imports),
        # dropping the broken bundled stubs is safe and unblocks CI.
        run: python -c "import os, shutil, rdkit; sp = os.path.dirname(os.path.dirname(rdkit.__file__)); shutil.rmtree(os.path.join(sp, 'rdkit-stubs'), ignore_errors=True)"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (black)
        run: black --check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Docstring check (pydoclint)
        run: pydoclint src

      - name: Run tests
        run: pytest --cov=challenge_data_checker --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  # The job above checks the exact pinned development environment. These two
  # check both ends of the dependency ranges declared in pyproject.toml, using
  # PyPI wheels: the newest releases on every supported Python, and the
  # declared floors on the oldest Python.
  test-latest:
    name: pytest (Python ${{ matrix.python-version }}, latest dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install package
        run: uv pip install -e ".[parquet,test,remote]"

      - name: Run tests
        run: pytest

  test-minimum-versions:
    name: pytest (Python 3.12, minimum dependency versions)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Install package at its declared dependency floors
        # lowest-direct resolves each direct dependency (including extras) to
        # the lowest version pyproject.toml allows, so this job fails if a
        # declared floor is no longer actually compatible.
        run: uv pip install --resolution lowest-direct -e ".[parquet,test,remote]"

      - name: Run tests
        run: pytest
