[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "challenge-data-checker"
version = "0.2.0"
description = "Audit ML benchmarking train/test splits for chemical data leakage and data quality issues."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "rdkit",
    "rich",
]

[project.optional-dependencies]
parquet = ["pyarrow"]
test = ["pytest", "pytest-cov"]

[project.scripts]
challenge-data-checker = "challenge_data_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
