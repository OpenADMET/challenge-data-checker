[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "challenge-data-checker"
version = "0.4.0"
description = "Audit ML benchmarking train/test splits for chemical data leakage and data quality issues."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "OpenADMET" },
    { name = "Open Molecular Software Foundation" },
]
requires-python = ">=3.12"
keywords = ["cheminformatics", "data leakage", "benchmarking", "machine learning", "ADMET", "RDKit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "rdkit>=2024.3",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/OpenADMET/challenge-data-checker"
Repository = "https://github.com/OpenADMET/challenge-data-checker"
Issues = "https://github.com/OpenADMET/challenge-data-checker/issues"
Changelog = "https://github.com/OpenADMET/challenge-data-checker/blob/main/CHANGELOG.md"

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
remote = ["huggingface_hub>=0.24", "requests>=2.31"]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["black", "ruff", "mypy", "pydoclint"]

[project.scripts]
challenge-data-checker = "challenge_data_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
challenge_data_checker = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pydoclint]
style = "numpy"
arg-type-hints-in-docstring = true
check-return-types = true
require-return-section-when-returning-nothing = true
